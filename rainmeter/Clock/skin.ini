[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,0

[MeasureTime]
Measure=Time
Format=%H:%M:%S

[MeterTime]
Meter=String
MeasureName=MeasureTime
FontSize=72
FontColor=255,255,255,220
FontFace=Segoe UI
AntiAlias=1
X=10
Y=10

[MeterDate]
Meter=String
MeasureName=MeasureTime
FontSize=18
FontColor=200,200,200,200
FontFace=Segoe UI
Text=%1
Text=%Y-%m-%d
X=10
Y=90
